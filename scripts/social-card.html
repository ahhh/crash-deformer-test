<!doctype html>
<!-- The GitHub social preview (1280x640): `node scripts/readme-shots.mjs <port> card` renders it to .github/social-preview.png. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:#15171c;font-family:"Segoe UI","Inter","Helvetica Neue",Arial,sans-serif}
.bg{position:absolute;inset:0;background:url(../docs/images/hero.webp) 70% center/cover}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,11,14,.92) 0%,rgba(10,11,14,.72) 38%,rgba(10,11,14,0) 70%)}
.txt{position:absolute;left:72px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:600px;color:#fff}
.row{display:flex;align-items:center;gap:24px}
img{width:104px;height:104px}
h1{margin:0;font-size:80px;font-weight:800;letter-spacing:-2px;line-height:1;white-space:nowrap}
p{margin:28px 0 0;width:540px;font-size:32px;line-height:1.3;color:#e3e6ea}
.url{margin-top:30px;font-size:24px;color:#ff9a4a;font-weight:600}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="txt">
  <div class="row"><img src="../docs/images/logo.svg" alt=""><h1>Crush Stream</h1></div>
  <p>Soft-body car crashes in the browser: derby, races, police chases and friends.</p>
  <div class="url">baconwhiskey.org/crush</div>
</div>
</body></html>
